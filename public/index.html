<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Interview Analyzer - Upload Interview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #e5e7eb;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      margin-top: 0;
      margin-bottom: 24px;
      color: #9ca3af;
    }
    form {
      background: #020617;
      border-radius: 12px;
      padding: 20px 16px;
      border: 1px solid #1f2937;
      margin-bottom: 24px;
    }
    .field-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .field {
      flex: 1 1 160px;
      min-width: 0;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #9ca3af;
    }
    select,
    textarea,
    input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.9rem;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    input[type="file"] {
      padding: 6px 10px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      background: #2563eb;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:disabled {
      background: #1f2937;
      cursor: default;
      opacity: 0.8;
    }
    .status {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: 8px;
    }
    .status.error {
      color: #f97373;
    }
    .results {
      background: #020617;
      border-radius: 12px;
      padding: 20px 16px;
      border: 1px solid #1f2937;
    }
    .results h2 {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric-card {
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 10px 12px;
    }
    .metric-label {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 2px;
    }
    .metric-value {
      font-size: 1.05rem;
    }
    .pill {
      display: inline-block;
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: #111827;
      border: 1px solid #1f2937;
      margin: 0 4px 4px 0;
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 16px;
      margin-bottom: 6px;
    }
    .suggestions-list {
      padding-left: 18px;
      margin: 4px 0 0;
    }
    .suggestions-list li {
      margin-bottom: 4px;
    }
    .transcript-box {
      margin-top: 8px;
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 10px 12px;
      font-size: 0.9rem;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .question-entry {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      position: relative;
    }
    .question-entry .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .add-question-btn {
      background: #10b981;
      margin-bottom: 16px;
    }
    .question-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #3b82f6;
    }
    .results-question-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .star-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 4px;
      text-transform: uppercase;
    }
    .star-s { background: #3b82f6; color: white; }
    .star-t { background: #8b5cf6; color: white; }
    .star-a { background: #ec4899; color: white; }
    .star-r { background: #10b981; color: white; }
    .star-missing { background: #4b5563; color: white; opacity: 0.5; }
    .overall-readiness {
      text-align: center;
      padding: 20px;
      background: #1e293b;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid #3b82f6;
    }
    .readiness-score {
      font-size: 3rem;
      font-weight: 800;
      color: #3b82f6;
      margin: 10px 0;
    }
    .readiness-label {
      font-size: 1.1rem;
      color: #9ca3af;
    }
    .category-scores {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .cat-score-card {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      min-width: 100px;
      border: 1px solid #1f2937;
    }
    .cat-label {
      font-size: 0.75rem;
      color: #9ca3af;
    }
    .cat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #10b981;
    }
    .benchmark-tag {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 12px;
      background: #334155;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #e2e8f0;
    }
    .non-verbal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .non-verbal-card {
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: center;
    }
    .nv-label {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 2px;
    }
    .nv-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Interview Analyzer</h1>
    <p class="subtitle">Upload your recorded interview clips, and get a detailed analysis including STAR method evaluation.</p>

    <form id="analyzer-form">
      <div class="field-row">
        <div class="field">
          <label for="roleType">Role type</label>
          <select id="roleType" name="roleType">
            <option value="software_engineer">Software Engineer</option>
            <option value="product_manager">Product Manager</option>
            <option value="data_analyst">Data Analyst</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="interviewType">Interview type</label>
          <select id="interviewType" name="interviewType">
            <option value="behavioral">Behavioral</option>
            <option value="technical">Technical</option>
            <option value="hr">HR / Screening</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="jobDescription">Job description or skills (optional)</label>
        <textarea id="jobDescription" name="jobDescription" placeholder="Paste a job description or list the main skills for this role."></textarea>
      </div>

      <div class="section-title" style="margin-top: 20px;">Interview Questions</div>
      <div id="questions-container">
        <!-- Question entries will be added here -->
      </div>
      
      <button type="button" id="add-question-btn" class="add-question-btn">
        <span>+ Add Question Clip</span>
      </button>

      <div style="margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid #1f2937; padding-top: 16px;">
        <button type="submit" id="submit-button">
          <span id="button-label">Analyze All Clips</span>
        </button>
        <div id="status" class="status"></div>
      </div>
    </form>

    <div id="results" class="results" style="display: none;">
      <h2>Overall Analysis</h2>
      <div id="summary-text" class="section-body" style="margin-bottom: 20px;"></div>

      <div id="question-results-container">
        <!-- Per-question results will be added here -->
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("analyzer-form");
    const statusEl = document.getElementById("status");
    const button = document.getElementById("submit-button");
    const buttonLabel = document.getElementById("button-label");
    const resultsEl = document.getElementById("results");
    const summaryTextEl = document.getElementById("summary-text");
    const questionsContainer = document.getElementById("questions-container");
    const addQuestionBtn = document.getElementById("add-question-btn");
    const questionResultsContainer = document.getElementById("question-results-container");

    let questionCount = 0;

    function createQuestionEntry() {
      questionCount++;
      const div = document.createElement("div");
      div.className = "question-entry";
      div.id = `question-entry-${questionCount}`;
      
      div.innerHTML = `
        <button type="button" class="remove-btn" onclick="removeQuestion(${questionCount})">Remove</button>
        <div class="question-title">Question ${questionCount}</div>
        <div class="field">
          <label>Question text (optional)</label>
          <input type="text" name="questionText[]" placeholder="e.g., Tell me about a time you failed.">
        </div>
        <div class="field" style="margin-top: 8px;">
          <label>Recorded clip (video/audio)</label>
          <input type="file" name="clips" accept="video/*,audio/*" required>
        </div>
      `;
      questionsContainer.appendChild(div);
    }

    function removeQuestion(id) {
      const entry = document.getElementById(`question-entry-${id}`);
      if (entry) {
        entry.remove();
      }
    }

    // Add initial question
    createQuestionEntry();

    addQuestionBtn.addEventListener("click", createQuestionEntry);

    function setLoading(loading, message) {
      if (loading) {
        button.disabled = true;
        buttonLabel.textContent = "Analyzing...";
        statusEl.textContent = message || "Processing your clips. This can take a minute.";
        statusEl.classList.remove("error");
      } else {
        button.disabled = false;
        buttonLabel.textContent = "Analyze All Clips";
      }
    }

    function renderResults(data) {
      resultsEl.style.display = "block";
      
      // Render Overall Readiness
      summaryTextEl.innerHTML = `
        <div class="overall-readiness">
          <div class="readiness-label">Overall Readiness Score</div>
          <div class="readiness-score">${data.avgScore}/100</div>
          <div class="benchmark-tag">Target: ${data.questions[0].scoring.benchmark.target}+ for ${data.roleType.replace('_', ' ')}</div>
          <div class="category-scores">
            <div class="cat-score-card">
              <div class="cat-label">Content</div>
              <div class="cat-value">${Math.round(data.questions.reduce((a, q) => a + q.scoring.categoryScores.content, 0) / data.questions.length)}%</div>
            </div>
            <div class="cat-score-card">
              <div class="cat-label">Communication</div>
              <div class="cat-value">${Math.round(data.questions.reduce((a, q) => a + q.scoring.categoryScores.communication, 0) / data.questions.length)}%</div>
            </div>
            <div class="cat-score-card">
              <div class="cat-label">Non-Verbal</div>
              <div class="cat-value">${Math.round(data.questions.reduce((a, q) => a + q.scoring.categoryScores.nonVerbal, 0) / data.questions.length)}%</div>
            </div>
          </div>
        </div>
        <p>${data.overallSummary}</p>
      `;

      questionResultsContainer.innerHTML = "";

      data.questions.forEach((q, index) => {
        const card = document.createElement("div");
        card.className = "results-question-card";
        
        const qTitle = q.questionText || `Question ${index + 1}`;
        
        // STAR Score visualization
        const starHtml = q.starAnalysis ? `
          <div style="margin: 10px 0;">
            <span class="star-badge ${q.starAnalysis.situation ? 'star-s' : 'star-missing'}">S</span>
            <span class="star-badge ${q.starAnalysis.task ? 'star-t' : 'star-missing'}">T</span>
            <span class="star-badge ${q.starAnalysis.action ? 'star-a' : 'star-missing'}">A</span>
            <span class="star-badge ${q.starAnalysis.result ? 'star-r' : 'star-missing'}">R</span>
          </div>
        ` : '';

        card.innerHTML = `
          <h3 style="margin-top:0; color:#3b82f6;">${qTitle}</h3>
          ${starHtml}
          
          <div class="metrics-grid">
            <div class="metric-card">
              <div class="metric-label">Words</div>
              <div class="metric-value">${q.analysis.metrics.wordCount}</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Fillers</div>
              <div class="metric-value">${q.analysis.metrics.fillerTotal}</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Pace</div>
              <div class="metric-value">${q.analysis.metrics.speechRatePerMinute || 'N/A'} wpm</div>
            </div>
          </div>

          <div class="section-title">Non-Verbal Cues</div>
          <div class="non-verbal-grid">
            <div class="non-verbal-card">
              <div class="nv-label">Eye Contact</div>
              <div class="nv-value">${q.analysis.nonVerbal.eyeContact}%</div>
            </div>
            <div class="non-verbal-card">
              <div class="nv-label">Confidence</div>
              <div class="nv-value">${q.analysis.nonVerbal.confidence}%</div>
            </div>
            <div class="non-verbal-card">
              <div class="nv-label">Energy</div>
              <div class="nv-value">${q.analysis.nonVerbal.energy}%</div>
            </div>
            <div class="non-verbal-card">
              <div class="nv-label">Expression</div>
              <div class="nv-value">${q.analysis.nonVerbal.dominantExpression}</div>
            </div>
          </div>

          <div class="section-title">Feedback</div>
          <p style="font-size:0.9rem; margin-top:4px;">${q.analysis.summary}</p>
          
          <div class="section-title">Suggestions</div>
          <ul class="suggestions-list">
            ${q.analysis.suggestions.map(s => `<li>${s}</li>`).join('')}
          </ul>

          <div class="section-title">Transcript</div>
          <div class="transcript-box">${q.transcript}</div>
        `;
        questionResultsContainer.appendChild(card);
      });

      resultsEl.style.display = "block";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const fileInputs = form.querySelectorAll('input[type="file"]');
      let hasFiles = false;
      fileInputs.forEach(input => {
        if (input.files && input.files.length > 0) hasFiles = true;
      });

      if (!hasFiles) {
        statusEl.textContent = "Please upload at least one video or audio clip.";
        statusEl.classList.add("error");
        return;
      }

      const formData = new FormData(form);

      setLoading(true);
      resultsEl.style.display = "none";

      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const data = await response.json().catch(() => null);
          throw new Error((data && data.error) || "Failed to analyze interview");
        }

        const data = await response.json();
        renderResults(data);
        statusEl.textContent = "Analysis complete.";
        statusEl.classList.remove("error");
      } catch (error) {
        statusEl.textContent = error.message || "Something went wrong while analyzing the interview.";
        statusEl.classList.add("error");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
