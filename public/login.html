<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AI Interview Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg-dark: #020617;
      --bg-card: rgba(15, 23, 42, 0.6);
      --border: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top right, #1e293b, #020617);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(to right, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-tabs {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .auth-tab {
      padding-bottom: 12px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
      color: var(--text-muted);
    }

    .auth-tab.active {
      color: white;
      border-bottom: 2px solid var(--primary);
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      padding: 14px 18px;
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: white;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s ease;
      margin-top: 12px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
    }

    .status {
      text-align: center;
      margin-top: 16px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <header>
      <h1>Interview AI</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to start your practice session</p>
    </header>

    <div class="auth-tabs">
      <div id="tab-login" class="auth-tab active" onclick="setAuthTab('login')">Login</div>
      <div id="tab-signup" class="auth-tab" onclick="setAuthTab('signup')">Sign Up</div>
    </div>

    <form id="auth-form">
      <div class="field">
        <label><i data-lucide="user"></i> Username</label>
        <input type="text" id="username" required placeholder="Your unique handle">
      </div>
      <div class="field">
        <label><i data-lucide="lock"></i> Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="auth-submit">
        <i data-lucide="log-in"></i>
        <span>Login</span>
      </button>
      <div id="auth-status" class="status"></div>
    </form>
  </div>

  <script>
    lucide.createIcons();
    let currentAuthTab = 'login';
    const authForm = document.getElementById('auth-form');
    const authStatus = document.getElementById('auth-status');
    const authSubmit = document.getElementById('auth-submit');

    function setAuthTab(tab) {
      currentAuthTab = tab;
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      authSubmit.querySelector('span').textContent = tab === 'login' ? 'Login' : 'Sign Up';
      authSubmit.querySelector('i').setAttribute('data-lucide', tab === 'login' ? 'log-in' : 'user-plus');
      lucide.createIcons();
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const endpoint = currentAuthTab === 'login' ? '/api/login' : '/api/signup';
      
      authStatus.textContent = 'Processing...';
      authStatus.style.color = 'var(--text-muted)';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/';
        } else {
          authStatus.textContent = data.error;
          authStatus.style.color = 'var(--danger)';
        }
      } catch (err) {
        authStatus.textContent = 'Authentication failed';
        authStatus.style.color = 'var(--danger)';
      }
    });

    // Check if already logged in
    fetch('/api/me').then(res => res.json()).then(data => {
      if (data.loggedIn) window.location.href = '/';
    });
  </script>
</body>
</html>
